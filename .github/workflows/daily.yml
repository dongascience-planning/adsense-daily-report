name: Daily AdSense Report

# 동아사이언스닷컴 일일 AdSense+GA4 리포트 (매일 09:00 KST 자동 실행)
on:
  schedule:
    - cron: "0 0 * * *"      # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}        # 수동 실행 버튼 (Actions 탭)

permissions:
  contents: write              # 데이터/일지를 저장소에 다시 커밋

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore credentials from secrets
        env:
          TOKEN_ADSENSE_JSON: ${{ secrets.TOKEN_ADSENSE_JSON }}
          GA4_KEY_JSON: ${{ secrets.GA4_KEY_JSON }}
        run: |
          printf '%s' "$TOKEN_ADSENSE_JSON" > token_adsense.json
          printf '%s' "$GA4_KEY_JSON" > ga4-key.json

      - name: Run pipeline
        env:
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID }}
          ADSENSE_CLIENT_SECRET: ${{ secrets.ADSENSE_CLIENT_SECRET }}
          ADSENSE_ACCOUNT: ${{ secrets.ADSENSE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ./ga4-key.json
          JANDI_WEBHOOK_URL: ${{ secrets.JANDI_WEBHOOK_URL }}
          MONTHLY_REVENUE_GOAL: ${{ secrets.MONTHLY_REVENUE_GOAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          DASHBOARD_URL: "https://dongascience-planning.github.io/adsense-report-view/"
          DASHBOARD_READONLY: "1"
        run: |
          python collect_adsense.py
          python collect_ga4.py
          python analyze.py
          python build_dashboard.py
          python build_onepager.py || echo "onepager 갱신 실패 — 비치명, 계속"
          python send_jandi.py

      - name: Commit data/journal back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: $(date -u +%F) automated run" || echo "no data changes"
          git push

      - name: Deploy report to public view repo (Pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          external_repository: dongascience-planning/adsense-report-view
          publish_branch: gh-pages
          publish_dir: ./report

      - name: Cleanup credentials
        if: always()
        run: rm -f token_adsense.json ga4-key.json
